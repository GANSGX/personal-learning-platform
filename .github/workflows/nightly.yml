name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CI: true

jobs:
  nightly:
    name: Nightly Deep Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and pnpm
        id: setup
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          playwright-cache: "true"
      - name: Run Full Audit (including devDependencies)
        run: pnpm audit --audit-level=high
      - name: Run Full Code and Curriculum Check
        run: pnpm check
      - name: Install Playwright Browsers (cache miss)
        if: steps.setup.outputs.playwright-cache-hit != 'true'
        run: pnpm --filter @plp/web exec playwright install --with-deps chromium webkit
      - name: Install Playwright System Dependencies (cache hit)
        if: steps.setup.outputs.playwright-cache-hit == 'true'
        run: pnpm --filter @plp/web exec playwright install-deps chromium webkit
      - name: Build Web Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://xkkinckqidlsbuxhhayz.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_WzrXeMViNpKPA-y2KJMcKw_plPZeazF
          NEXT_PUBLIC_ALLOW_E2E_AUTH: "true"
        run: pnpm --filter @plp/web build
      - name: Run Cross-Browser E2E Suite with Flakiness Stress Test
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm e2e:all --repeat-each=3
      - name: Run Visual Regression Suite
        continue-on-error: true
        run: pnpm e2e:visual
      - name: Upload Playwright artifacts on failure or visual diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
