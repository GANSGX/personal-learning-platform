name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview_branch:
        description: Branch label for Cloudflare Pages preview deploy (leave empty for production redeploy)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  CLOUDFLARE_ACCOUNT_ID: 757419806dbfab9130f71f69b2e5493f
  NEXT_PUBLIC_SUPABASE_URL: https://xkkinckqidlsbuxhhayz.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_WzrXeMViNpKPA-y2KJMcKw_plPZeazF

jobs:
  deploy-production:
    name: Deploy production (Pages)
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.preview_branch == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm --filter @plp/web pages:build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @plp/web exec wrangler pages deploy out --project-name=personal-learning-platform --branch=main
      - name: Post-deploy smoke test
        run: |
          echo "Verifying production endpoint..."
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://personal-learning-platform.pages.dev/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "Production deployment is healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed: production endpoint did not return HTTP 200"
          exit 1

  deploy-preview:
    name: Deploy preview (Pages)
    if: github.event_name == 'workflow_dispatch' && inputs.preview_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm --filter @plp/web pages:build
      - name: Publish preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @plp/web exec wrangler pages deploy out --project-name=personal-learning-platform --branch=${{ inputs.preview_branch }}
