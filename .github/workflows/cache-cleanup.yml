name: Cache cleanup

on:
  push:
    branches: [main]
  schedule:
    # Weekly: Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Delete caches older than this many days
        required: false
        default: "7"

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  prune:
    name: Prune Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale and duplicate cache entries
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const dispatchDays = Number("${{ inputs.max_age_days || 7 }}");
            const maxAgeDays =
              eventName === "workflow_dispatch"
                ? dispatchDays
                : eventName === "schedule"
                  ? 7
                  : 1;
            const bytesLimit = 8 * 1024 * 1024 * 1024;

            const { owner, repo } = context.repo;

            async function listCaches() {
              return github.paginate(github.rest.actions.getActionsCacheList, {
                owner,
                repo,
                per_page: 100,
              });
            }

            function totalBytes(caches) {
              return caches.reduce((sum, cache) => sum + cache.size_in_bytes, 0);
            }

            function cachePrefix(key) {
              if (key.startsWith("playwright-")) {
                return "playwright";
              }
              if (key.startsWith("node-cache-")) {
                return "node-cache";
              }
              if (key.startsWith("turbo-")) {
                return "turbo";
              }
              return "other";
            }

            let deleted = 0;
            let caches = await listCaches();
            const thresholdMs = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;

            for (const cache of caches) {
              if (new Date(cache.created_at).getTime() >= thresholdMs) {
                continue;
              }

              await github.rest.actions.deleteActionsCacheById({
                owner,
                repo,
                cache_id: cache.id,
              });
              deleted += 1;
            }

            caches = await listCaches();
            let kept = caches.length;
            let sizeGb = totalBytes(caches) / 1024 ** 3;

            if (totalBytes(caches) > bytesLimit) {
              const groups = new Map();

              for (const cache of caches) {
                const prefix = cachePrefix(cache.key);
                const bucket = groups.get(prefix) ?? [];
                bucket.push(cache);
                groups.set(prefix, bucket);
              }

              for (const [prefix, items] of groups.entries()) {
                items.sort(
                  (left, right) =>
                    new Date(right.created_at).getTime() - new Date(left.created_at).getTime(),
                );

                const keepCount = prefix === "turbo" ? 3 : 2;

                for (const cache of items.slice(keepCount)) {
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id,
                  });
                  deleted += 1;
                }
              }

              caches = await listCaches();
              kept = caches.length;
              sizeGb = totalBytes(caches) / 1024 ** 3;
            }

            core.summary.addHeading("Actions cache cleanup");
            core.summary.addRaw(
              [
                `Trigger: **${eventName}**`,
                `Age threshold: **${maxAgeDays}** day(s)`,
                `Deleted: **${deleted}** entries`,
                `Remaining: **${kept}** entries (~**${sizeGb.toFixed(2)} GB**)`,
              ].join("\n\n"),
            );
            await core.summary.write();

            core.info(`Deleted ${deleted} caches; ${kept} remain (~${sizeGb.toFixed(2)} GB)`);
