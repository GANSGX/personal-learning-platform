name: Cache cleanup

on:
  schedule:
    # Weekly: Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Delete caches older than this many days
        required: false
        default: "7"

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  prune:
    name: Prune Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale cache entries
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeDays = Number("${{ inputs.max_age_days || 7 }}");
            const thresholdMs = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;

            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner,
              repo,
              per_page: 100,
            });

            let deleted = 0;
            let kept = 0;

            for (const cache of caches) {
              if (new Date(cache.created_at).getTime() < thresholdMs) {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id,
                });
                deleted += 1;
                continue;
              }

              kept += 1;
            }

            core.summary.addHeading("Actions cache cleanup");
            core.summary.addRaw(
              `Deleted **${deleted}** cache entries older than ${maxAgeDays} days. Kept **${kept}** recent entries.`,
            );
            await core.summary.write();

            core.info(`Deleted ${deleted} caches, kept ${kept}`);
