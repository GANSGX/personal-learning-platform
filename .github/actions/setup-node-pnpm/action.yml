name: "Setup Node.js and pnpm"
description: "Composite action to setup pnpm, Node.js with caching, and install dependencies"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  install:
    description: "Whether to run pnpm install --frozen-lockfile"
    required: false
    default: "true"
  turbo-cache:
    description: "Whether to cache .turbo artifacts"
    required: false
    default: "true"
  playwright-cache:
    description: "Whether to cache Playwright browsers"
    required: false
    default: "false"
  playwright-cache-key-suffix:
    description: "Optional suffix for Playwright cache key (e.g. -cross-browser)"
    required: false
    default: ""

outputs:
  playwright-cache-hit:
    description: "Whether Playwright browser cache was hit"
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Cache Turbo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright Browsers
      id: playwright-cache
      if: inputs.playwright-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}${{ inputs.playwright-cache-key-suffix }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}${{ inputs.playwright-cache-key-suffix }}
          playwright-${{ runner.os }}-
