name: "Setup Node.js and pnpm"
description: "Composite action to setup pnpm, Node.js with caching, and install dependencies"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  install:
    description: "Whether to run pnpm install --frozen-lockfile"
    required: false
    default: "true"
  turbo-cache:
    description: "Whether to cache .turbo artifacts"
    required: false
    default: "true"
  playwright-cache:
    description: "Whether to cache Playwright browsers"
    required: false
    default: "false"

outputs:
  playwright-cache-hit:
    description: "Whether Playwright browser cache was hit"
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

    - name: Setup Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Cache Turbo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright Browsers
      id: playwright-cache
      if: inputs.playwright-cache == 'true'
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-
