pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: if command -v gitleaks >/dev/null 2>&1; then gitleaks protect --staged --verbose; fi
    prettier:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,yml,yaml,md,mdx,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec eslint --fix --max-warnings=0 --no-warn-ignored {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "*.{md,mdx}"
      run: pnpm exec markdownlint-cli2 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    unit-tests:
      run: pnpm test
    graph-validate:
      run: pnpm graph:validate
    architecture:
      run: pnpm architecture

post-merge:
  commands:
    git-prune-merged:
      run: pnpm git:prune-merged
